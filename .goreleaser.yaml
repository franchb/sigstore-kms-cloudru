version: 2

project_name: sigstore-kms-cloudru

env:
  - CGO_ENABLED=0

builds:
  - id: sigstore-kms-cloudru
    main: ./cmd/sigstore-kms-cloudru
    binary: sigstore-kms-cloudru
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: sigstore-kms-cloudru
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    signature: ${artifact}.sigstore.json

release:
  github:
    owner: franchb
    name: sigstore-kms-cloudru
  name_template: "v{{ .Version }}"

changelog:
  disable: true

snapshot:
  version_template: '{{ .Version }}-next'
