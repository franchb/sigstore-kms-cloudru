version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosec
    - revive
    - ineffassign
    - gocritic
    - testifylint
    - modernize
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - iface
    - intrange
    - iotamixing
    - makezero
    - mirror
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - sqlclosecheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - asasalint
    - arangolint
    - decorder
    - exhaustruct
    - depguard
    - forbidigo
    - funcorder
    - funlen
    - ginkgolinter
    - gochecknoglobals
    - godox
    - goheader
    - gomodguard
    - gosmopolitan
    - grouper
    - importas
    - inamedparam
    - interfacebloat
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - mnd
    - musttag
    - paralleltest
    - prealloc
    - promlinter
    - protogetter
    - rowserrcheck
    - sloglint
    - spancheck
    - tagalign
    - tagliatelle
    - testpackage
    - unqueryvet
    - varnamelen
    - zerologlint

  settings:
    errcheck:
      exclude-functions:
        - io.Copy
        - (io.Closer).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (*os/exec.Cmd).Wait
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (net.Listener).Close
        - os.Remove
        - os.RemoveAll
        - (*net/http.Server).Serve
    gosec:
      excludes: []
    goconst:
      min-occurrences: 4
    funlen:
      lines: 100
      statements: 60
    cyclop:
      max-complexity: 16
    mnd:
      ignored-numbers:
        - '0o755'
      checks:
        - argument
        - case
        - condition
        - operation
        - return
    varnamelen:
      min-name-length: 2
      ignore-names:
        - y
        - c
        - ok
        - tt
        - op
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - github.com/sigstore/sigstore/pkg/signature.Verifier
    testpackage:
      allow-packages:
        - cloudru
        - main
    depguard:
      rules:
        main:
          deny:
            - pkg: log
              desc: "Use io.Writer-based logging instead."
    exhaustruct:
      exclude:
        # stdlib types where partial init is idiomatic.
        - '.*\.Client$'
        - '.*\.Server$'
        - '.*syscall\.SysProcAttr$'
        # Anonymous structs (table-driven test cases).
        - '.*<anonymous>$'
        # http.Transport is configured by setting Proxy; other fields stay at zero.
        - '.*http\.Transport$'
        # Internal types built up field-by-field or relying on zero values.
        - '.*cloudru\.SignerVerifier$'
        - '.*cloudru\.kmsStub$'
        - '.*cloudru\.service$'
    # Cloud.ru KMS JSON uses snake_case field names.
    tagliatelle:
      case:
        rules:
          json: snake
    goheader:
      template: |-
        Copyright 2026 franchb.

        SPDX-License-Identifier: Apache-2.0

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - errcheck
          - cyclop
          - forcetypeassert
          - noctx
          - lll

formatters:
  enable:
    - gofumpt
